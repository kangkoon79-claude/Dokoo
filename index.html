<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뻥이요</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&display=swap">
<style>
/* 레이아웃: 밤 시장 골목 한 화면. 가운데 뻥튀기 기계(캔버스), 위에 목표 시간, 아래/옆에 결과 카드. */
:root {
  --night: #1d1022;
  --night-deep: #120a15;
  --paper: #fff3df;
  --muted: #cbb39b;
  --lantern: #ff7f3f;
  --gold: #ffcc4d;
  --char: #2a1a12;
  --card: #2a1a2d;
  --line: rgba(255, 243, 223, 0.16);
  --display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --ui: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; }
[hidden] { display: none !important; }
body { background: var(--night); color: var(--paper); font-family: var(--ui); font-size: 16px; }
#app {
  position: relative; height: 100%; overflow: hidden;
  user-select: none; -webkit-user-select: none; touch-action: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#app.cranking #stage { cursor: grabbing; }

.hud {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.logo { font-family: var(--display); font-size: 28px; color: var(--gold); letter-spacing: 0.02em; text-shadow: 0 2px 0 var(--char); }
.stats { display: flex; gap: 16px; font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--paper); font-weight: 400; }
.hud button { pointer-events: auto; }

.chip {
  font: inherit; font-size: 15px; color: var(--paper); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
.chip:hover { border-color: var(--muted); }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.target {
  position: absolute; left: 0; right: 0; top: 12%;
  text-align: center; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.target .label { font-size: 18px; color: var(--muted); letter-spacing: 0.08em; }
.target .num {
  font-family: var(--display); font-size: clamp(60px, 14vw, 120px); line-height: 1.05; color: var(--gold);
  font-variant-numeric: tabular-nums; text-shadow: 0 4px 0 var(--char), 0 0 40px rgba(255, 127, 63, 0.45);
  transition: opacity 0.35s ease, filter 0.35s ease, transform 0.35s ease;
}
.target .num small { font-size: 0.42em; margin-left: 4px; }
.target .sub { font-size: 20px; color: var(--paper); margin-top: 6px; text-wrap: balance; }
.target.counting .num { opacity: 0; filter: blur(14px); transform: scale(1.35); }
.target.counting .label { opacity: 0; }

.bbang {
  position: absolute; left: 0; right: 0; top: 18%;
  text-align: center; pointer-events: none;
  font-family: var(--display); font-size: clamp(72px, 19vw, 190px); line-height: 1;
  color: var(--word, var(--gold));
  -webkit-text-stroke: 6px var(--char); paint-order: stroke fill;
  text-shadow: 0 8px 0 var(--char), 0 0 60px rgba(255, 200, 80, 0.6);
  opacity: 0;
}
.bbang.go { animation: bbang 1.6s cubic-bezier(.2, 1.6, .4, 1) forwards; }
@keyframes bbang {
  0% { opacity: 0; transform: scale(0.2) rotate(-14deg); }
  18% { opacity: 1; transform: scale(1.18) rotate(4deg); }
  30% { transform: scale(0.96) rotate(-3deg); }
  42% { transform: scale(1.04) rotate(1deg); }
  80% { opacity: 1; transform: scale(1) rotate(0); }
  100% { opacity: 0; transform: scale(1.08) translateY(-20px); }
}

.hint {
  position: absolute; left: 0; right: 0; bottom: 0; margin: 0;
  padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  text-align: center; font-size: 17px; color: var(--muted); pointer-events: none; text-wrap: balance;
}
.hint kbd { font: inherit; color: var(--paper); border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; }

.card {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(440px, calc(100% - 32px)); max-height: calc(100% - 110px); overflow-y: auto; box-sizing: border-box;
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  animation: rise 0.35s ease-out;
}
@media (min-width: 960px) {
  .card { left: auto; right: max(24px, env(safe-area-inset-right, 0px)); top: 50%; bottom: auto; transform: translateY(-50%); animation-name: rise-side; }
}
@keyframes rise { from { opacity: 0; translate: 0 24px; } to { opacity: 1; translate: 0 0; } }
@keyframes rise-side { from { opacity: 0; translate: 24px 0; } to { opacity: 1; translate: 0 0; } }

.eyebrow { margin: 0; font-size: 15px; color: var(--muted); letter-spacing: 0.08em; }
.grade-row { display: flex; align-items: center; gap: 12px; }
.swatch { width: 34px; height: 34px; border-radius: 50%; flex: none; border: 2px solid var(--line); }
.card h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1.1; text-wrap: balance; }
.quote { margin: 0; font-size: 19px; color: var(--paper); }
.quote::before { content: "주인장: "; color: var(--muted); }

.times { margin: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.times div { min-width: 0; }
.times dt { font-size: 14px; color: var(--muted); }
.times dd { margin: 0; font-size: 22px; font-variant-numeric: tabular-nums; }

.meter-wrap { display: flex; flex-direction: column; gap: 6px; }
.meter, .meter-labels { display: flex; }
.meter { position: relative; height: 14px; border-radius: 7px; overflow: visible; }
.meter span { height: 100%; }
.meter span:first-child { border-radius: 7px 0 0 7px; }
.meter span:last-of-type { border-radius: 0 7px 7px 0; }
.meter .marker {
  position: absolute; top: -6px; width: 6px; height: 26px; margin-left: -3px; border-radius: 3px;
  background: var(--paper); box-shadow: 0 0 0 2px var(--char); transition: left 0.6s cubic-bezier(.2, 1.4, .4, 1);
}
.meter-labels span { font-size: 13px; color: var(--muted); text-align: center; min-width: 0; }
.seg-raw { flex: 1.5; background: #e8dcc0; }
.seg-under { flex: 0.9; background: #d4ad62; }
.seg-good { flex: 1.2; background: #fff7e6; }
.seg-slight { flex: 0.9; background: #c27c3a; }
.seg-burnt { flex: 1.5; background: #4a3426; }
.seg-char { flex: 1; background: #120e0c; box-shadow: inset 0 0 0 1px #ff7f3f; }

.score { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
.score span { color: var(--muted); font-size: 17px; }
.score b { font-family: var(--display); font-weight: 400; font-size: 44px; color: var(--gold); }
.score small { color: var(--muted); font-size: 17px; }

.btn {
  font: inherit; font-size: 22px; color: var(--char); background: var(--gold);
  border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer;
  box-shadow: 0 4px 0 #b8862a;
}
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #b8862a; }

.history { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.history li { display: flex; justify-content: space-between; gap: 12px; font-size: 17px; border-bottom: 1px solid var(--line); padding-bottom: 6px; font-variant-numeric: tabular-nums; }
.history li span:first-child { color: var(--muted); }
.best { margin: 0; color: var(--muted); font-size: 16px; }

@media (prefers-reduced-motion: reduce) {
  .bbang.go { animation-duration: 1.2s; animation-timing-function: ease-out; }
  .card { animation: none; }
  .target .num { transition: none; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="stage" aria-label="뻥튀기 기계. 누르고 있으면 레버가 돌아가고, 손을 떼면 뻥튀기가 터집니다."></canvas>

  <header class="hud">
    <div class="logo">뻥이요</div>
    <div class="stats">
      <span>판 <b id="round">1</b>/5</span>
      <span>점수 <b id="total">0</b></span>
      <span>최고 <b id="best">0</b></span>
    </div>
    <button id="mute" class="chip" type="button" aria-pressed="false">소리 켜짐</button>
  </header>

  <section id="target" class="target" aria-live="polite">
    <div class="label">이번 판 목표</div>
    <div class="num"><span id="targetNum">6.4</span><small>초</small></div>
    <div class="sub" id="targetSub">레버를 꾹 누른 채로 돌리세요</div>
  </section>

  <div id="bbang" class="bbang" aria-hidden="true">뻥이요!</div>

  <p class="hint" id="hint">화면을 꾹 누르고 있으면 레버가 돌아갑니다 · 목표 시간이 됐다 싶을 때 손을 떼세요 · <kbd>스페이스</kbd>도 됩니다</p>

  <section id="result" class="card" hidden aria-live="polite">
    <div class="grade-row"><span class="swatch" id="rSwatch"></span><h2 id="rName">완벽한 뻥튀기</h2></div>
    <p class="quote" id="rLine"></p>
    <dl class="times">
      <div><dt>목표</dt><dd id="rTarget">0.00초</dd></div>
      <div><dt>뗀 시간</dt><dd id="rTime">0.00초</dd></div>
      <div><dt>차이</dt><dd id="rDiff">0.00초</dd></div>
    </dl>
    <div class="meter-wrap" aria-hidden="true">
      <div class="meter">
        <span class="seg-raw"></span><span class="seg-under"></span><span class="seg-good"></span>
        <span class="seg-slight"></span><span class="seg-burnt"></span><span class="seg-char"></span>
        <i class="marker" id="rMarker"></i>
      </div>
      <div class="meter-labels">
        <span class="seg-raw" style="background:none">생쌀</span><span class="seg-under" style="background:none">덜 튐</span>
        <span class="seg-good" style="background:none">딱 좋음</span><span class="seg-slight" style="background:none">살짝 탐</span>
        <span class="seg-burnt" style="background:none">새카맣게</span><span class="seg-char" style="background:none;box-shadow:none">숯</span>
      </div>
    </div>
    <div class="score"><span>이번 판</span><b id="rScore">0</b><small>/ 1000점</small></div>
    <button id="next" class="btn" type="button">다음 판</button>
  </section>

  <section id="final" class="card" hidden aria-live="polite">
    <p class="eyebrow">5판 결과</p>
    <h2 id="fRank">뻥튀기 명인</h2>
    <div class="score"><span>합계</span><b id="fTotal">0</b><small>/ 5000점</small></div>
    <ol class="history" id="fList"></ol>
    <p class="best" id="fBest"></p>
    <button id="again" class="btn" type="button">다시 하기</button>
  </section>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const app = $('app');
  const cvs = $('stage');
  const ctx = cvs.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2;

  const ROUNDS = 5;
  const VW = 800, VH = 560, GROUND = 470, GRAV = 1500;
  const DRUM = { left: 300, right: 540, cy: 340, r: 62, crankX: 588 };
  const BEST_KEY = 'bbangiyo-best';

  // 등급: 목표와의 차이(초)에 따라 결정. colors는 튀어나오는 알갱이 색.
  const G = {
    golden: { name: '황금 뻥튀기', line: '이건 팔지 말고 내가 먹어야겠다!', colors: ['#ffe9a8', '#ffd35c', '#fff6d8', '#f6c343', '#ffffff'],
      size: 1.2, count: 560, speed: 1.2, smoke: '255,240,210', smokeA: 0.3, flash: 1, flashColor: '255,236,170',
      confetti: 160, sparkle: 140, rays: '255,210,90', hl: true, word: '뻥이요!', wordColor: '#ffd84d' },
    perfect: { name: '완벽한 뻥튀기', line: '구름처럼 부풀었네. 오늘 장사 대박이다.', colors: ['#fffaf0', '#fff3dc', '#ffeccc', '#ffffff'],
      size: 1.1, count: 480, speed: 1.1, smoke: '250,245,235', smokeA: 0.32, flash: 1, flashColor: '255,250,240',
      confetti: 110, sparkle: 60, rays: '255,240,200', hl: true, word: '뻥이요!', wordColor: '#ffe27a' },
    good: { name: '바삭 고소', line: '바삭바삭하다! 한 봉 더 담아.', colors: ['#fbecc9', '#f5dfb0', '#fff4dd'],
      size: 1, count: 400, speed: 1, smoke: '245,240,230', smokeA: 0.3, flash: 0.9, flashColor: '255,248,235',
      confetti: 60, sparkle: 0, rays: '255,230,190', hl: true, word: '뻥이요!', wordColor: '#ffcc4d' },
    ok: { name: '먹을 만함', line: '그럭저럭 팔 만은 하겠네.', colors: ['#f0d59a', '#e9c886', '#f7e3b6'],
      size: 0.9, count: 320, speed: 0.9, smoke: '235,228,215', smokeA: 0.3, flash: 0.75, flashColor: '255,245,225',
      confetti: 0, sparkle: 0, rays: null, hl: true, word: '뻥이요!', wordColor: '#f3c25a' },
    under: { name: '덜 튀겨짐', line: '아직 딱딱해. 이빨 나가겠다.', colors: ['#e3c78a', '#d8b46c', '#cfa75a'],
      size: 0.6, count: 240, speed: 0.7, smoke: '230,225,215', smokeA: 0.22, flash: 0.5, flashColor: '255,245,225',
      confetti: 0, sparkle: 0, rays: null, hl: true, word: '뻥이요?', wordColor: '#e0c690' },
    raw: { name: '생쌀 그대로', line: '쌀이 그대로 나왔잖아… 다시 넣어!', colors: ['#efe6cf', '#e2d6b5', '#d7c79f'],
      size: 0.3, count: 280, speed: 0.45, smoke: '220,220,215', smokeA: 0.15, flash: 0.25, flashColor: '255,255,255',
      confetti: 0, sparkle: 0, rays: null, hl: false, word: '뻥…이요?', wordColor: '#e8dcc0' },
    slight: { name: '살짝 탐', line: '약간 탄 맛… 이것도 맛이라고 우겨보자.', colors: ['#d39a52', '#b9773a', '#e0b06f'],
      size: 0.95, count: 360, speed: 1, smoke: '120,100,85', smokeA: 0.4, flash: 0.8, flashColor: '255,220,170',
      confetti: 0, sparkle: 0, rays: null, hl: true, word: '뻥이요!', wordColor: '#f0a050' },
    burnt: { name: '새카맣게 탐', line: '새카맣게 탔다! 동네에 탄내 진동한다.', colors: ['#3a2a20', '#241a14', '#4d3a2c', '#161210'],
      size: 0.9, count: 380, speed: 1.05, smoke: '35,30,28', smokeA: 0.7, flash: 0.8, flashColor: '255,170,90',
      confetti: 0, sparkle: 0, rays: null, hl: false, embers: 60, word: '뻥이요!', wordColor: '#ff8a3d' },
    charcoal: { name: '숯덩이', line: '숯이 됐네. 이건 고깃집에 팔자.', colors: ['#151210', '#0c0a09', '#2a1f18'],
      size: 0.85, count: 420, speed: 1.25, smoke: '18,16,15', smokeA: 0.85, flash: 1, flashColor: '255,120,40',
      confetti: 0, sparkle: 0, rays: '255,110,40', hl: false, embers: 200, word: '콰광!', wordColor: '#ff5a2a' },
  };

  function gradeFor(d) {
    const a = Math.abs(d);
    if (a <= 0.05) return G.golden;
    if (a <= 0.15) return G.perfect;
    if (a <= 0.3) return G.good;
    if (a <= 0.6) return G.ok;
    if (d < 0) return d >= -1.5 ? G.under : G.raw;
    if (d <= 1.5) return G.slight;
    return d <= 3 ? G.burnt : G.charcoal;
  }
  function scoreFor(d) {
    const a = Math.abs(d);
    if (a <= 0.05) return 1000;
    return Math.max(0, Math.round(1000 * Math.exp(-(a - 0.05) * 2)));
  }
  function rankFor(total) {
    if (total >= 4500) return '뻥튀기 명인';
    if (total >= 3500) return '시장 단골 사장님';
    if (total >= 2500) return '견습 뻥튀기꾼';
    if (total >= 1500) return '동네 꼬마 조수';
    return '쌀 낭비 전문가';
  }

  const store = {
    get() { try { return parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) { return 0; } },
    set(v) { try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* 저장 불가 환경 */ } },
  };

  // ---------- 상태 ----------
  let state = 'intro';
  let round = 1, total = 0, best = store.get();
  let history = [];
  let target = 0, startT = 0, elapsed = 0;
  let angle = 0, lastHalf = 0, heat = 0, pressure = 0;
  let parts = [], smokes = [], confetti = [], sparkles = [], embers = [];
  let lid = null, flash = 0, flashColor = '255,255,255', shake = 0, rays = 0, rayColor = null;
  let time = 0;

  // ---------- 화면 크기 ----------
  let W = 0, H = 0, DPR = 1, S = 1, OX = 0, OY = 0;
  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = cvs.clientWidth; H = cvs.clientHeight;
    cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
    // 세로 화면에서는 양옆 여백을 잘라 기계를 크게 보여준다
    S = Math.min(W / (W < H ? VW * 0.8 : VW), H / (VH + 40));
    OX = W / 2 - (W < H ? 430 : VW / 2) * S;
    OY = Math.max(0, (H - VH * S) / 2 + H * 0.06);
  }
  window.addEventListener('resize', resize);

  // ---------- 소리 ----------
  let AC = null, muted = false, noiseBuf = null;
  function audio() {
    if (!AC) {
      try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
    }
    if (AC && AC.state === 'suspended') AC.resume();
    return AC;
  }
  function getNoise() {
    if (noiseBuf) return noiseBuf;
    const len = AC.sampleRate * 2;
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuf;
  }
  function tick() {
    if (muted || !AC) return;
    const t = AC.currentTime;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(180 + Math.random() * 60, t);
    g.gain.setValueAtTime(0.035, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.connect(g).connect(AC.destination);
    o.start(t); o.stop(t + 0.06);
  }
  function boom(power) {
    if (muted || !AC) return;
    const t = AC.currentTime;
    const src = AC.createBufferSource(); src.buffer = getNoise();
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(5000 * power + 400, t);
    lp.frequency.exponentialRampToValueAtTime(160, t + 1.2);
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.9 * power + 0.05, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
    src.connect(lp).connect(g).connect(AC.destination);
    src.start(t); src.stop(t + 1.5);

    const o = AC.createOscillator(), og = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(110, t);
    o.frequency.exponentialRampToValueAtTime(32, t + 0.5);
    og.gain.setValueAtTime(0.9 * power, t);
    og.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    o.connect(og).connect(AC.destination);
    o.start(t); o.stop(t + 0.65);
  }
  function chime() {
    if (muted || !AC) return;
    const t = AC.currentTime + 0.15;
    [880, 1175, 1568].forEach((f, i) => {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i * 0.09);
      g.gain.exponentialRampToValueAtTime(0.12, t + i * 0.09 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.09 + 0.6);
      o.connect(g).connect(AC.destination);
      o.start(t + i * 0.09); o.stop(t + i * 0.09 + 0.65);
    });
  }

  // ---------- 진행 ----------
  const ui = {
    round: $('round'), total: $('total'), best: $('best'),
    target: $('target'), targetNum: $('targetNum'), targetSub: $('targetSub'),
    hint: $('hint'), bbang: $('bbang'), result: $('result'), final: $('final'),
  };
  function fmt(n) { return n.toLocaleString('ko-KR'); }
  function updateHud() {
    ui.round.textContent = round;
    ui.total.textContent = fmt(total);
    ui.best.textContent = fmt(best);
  }

  function newRound() {
    target = Math.round((3 + Math.random() * 6) * 10) / 10;
    state = 'intro';
    parts = []; smokes = []; confetti = []; sparkles = []; embers = [];
    lid = null; heat = 0; pressure = 0; elapsed = 0;
    ui.targetNum.textContent = target.toFixed(1);
    ui.targetSub.textContent = '레버를 꾹 누른 채로 돌리세요';
    ui.target.classList.remove('counting');
    ui.target.hidden = false;
    ui.hint.hidden = false;
    ui.result.hidden = true;
    ui.final.hidden = true;
    updateHud();
  }

  function startCrank() {
    if (state !== 'intro') return;
    audio();
    state = 'cranking';
    startT = performance.now();
    lastHalf = Math.floor(angle / Math.PI);
    ui.target.classList.add('counting');
    ui.targetSub.textContent = '속으로 세는 중…';
    ui.hint.hidden = true;
    app.classList.add('cranking');
  }

  function releaseCrank() {
    if (state !== 'cranking') return;
    const t = (performance.now() - startT) / 1000;
    app.classList.remove('cranking');
    if (t < 0.25) {
      state = 'intro';
      ui.target.classList.remove('counting');
      ui.targetSub.textContent = '너무 빨리 뗐어요. 꾹 누른 채로 기다리세요';
      ui.hint.hidden = false;
      return;
    }
    pop(t);
  }

  function pop(t) {
    state = 'popping';
    app.classList.remove('cranking');
    elapsed = t;
    const d = t - target;
    const g = gradeFor(d);
    const sc = scoreFor(d);
    total += sc;
    history.push({ g, sc, d });

    ui.target.hidden = true;
    explode(g);
    boom(Math.max(0.25, g.speed * 0.8));
    if (g === G.golden || g === G.perfect) chime();

    ui.bbang.textContent = g.word;
    ui.bbang.style.setProperty('--word', g.wordColor);
    ui.bbang.classList.remove('go');
    void ui.bbang.offsetWidth;
    ui.bbang.classList.add('go');

    updateHud();
    setTimeout(() => showResult(g, sc, d), 1250);
  }

  function showResult(g, sc, d) {
    state = 'result';
    $('rName').textContent = g.name;
    $('rLine').textContent = g.line;
    $('rSwatch').style.background = g.colors[0];
    $('rTarget').textContent = target.toFixed(2) + '초';
    $('rTime').textContent = elapsed.toFixed(2) + '초';
    const sign = d > 0 ? '+' : d < 0 ? '−' : '';
    $('rDiff').textContent = sign + Math.abs(d).toFixed(2) + '초';
    $('rScore').textContent = fmt(sc);
    const pct = (Math.min(4, Math.max(-3, d)) + 3) / 7 * 100;
    const marker = $('rMarker');
    marker.style.transition = 'none';
    marker.style.left = '50%';
    ui.result.hidden = false;
    void marker.offsetWidth;
    marker.style.transition = '';
    marker.style.left = pct + '%';
    const next = $('next');
    next.textContent = round >= ROUNDS ? '결과 보기' : '다음 판';
    next.focus({ preventScroll: true });
  }

  function showFinal() {
    state = 'final';
    ui.result.hidden = true;
    const isBest = total > best;
    if (isBest) { best = total; store.set(best); }
    updateHud();
    $('fRank').textContent = rankFor(total);
    $('fTotal').textContent = fmt(total);
    const list = $('fList');
    list.textContent = '';
    history.forEach((h, i) => {
      const li = document.createElement('li');
      const a = document.createElement('span');
      a.textContent = (i + 1) + '판 · ' + h.g.name;
      const b = document.createElement('span');
      b.textContent = fmt(h.sc) + '점';
      li.append(a, b);
      list.append(li);
    });
    $('fBest').textContent = isBest ? '새 최고 기록입니다!' : '최고 기록 ' + fmt(best) + '점';
    ui.final.hidden = false;
    $('again').focus({ preventScroll: true });
  }

  $('next').addEventListener('click', () => {
    if (round >= ROUNDS) { showFinal(); return; }
    round += 1;
    newRound();
  });
  $('again').addEventListener('click', () => {
    round = 1; total = 0; history = [];
    newRound();
  });
  $('mute').addEventListener('click', (e) => {
    muted = !muted;
    e.currentTarget.textContent = muted ? '소리 꺼짐' : '소리 켜짐';
    e.currentTarget.setAttribute('aria-pressed', String(muted));
  });

  // ---------- 입력 ----------
  app.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button, .card')) return;
    if (e.button !== undefined && e.button > 0) return;
    e.preventDefault();
    startCrank();
  });
  window.addEventListener('pointerup', releaseCrank);
  window.addEventListener('pointercancel', releaseCrank);
  window.addEventListener('blur', releaseCrank);
  app.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('keydown', (e) => {
    if (e.code !== 'Space') return;
    if (state === 'intro' || state === 'cranking') e.preventDefault();
    if (!e.repeat) startCrank();
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space') releaseCrank();
  });

  // ---------- 폭발 ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (arr) => arr[(Math.random() * arr.length) | 0];

  function explode(g) {
    const ox = DRUM.left - 8, oy = DRUM.cy;
    const k = reduceMotion ? 0.5 : 1;
    const n = Math.round(g.count * k);
    for (let i = 0; i < n; i++) {
      const spray = Math.random() < 0.3;
      const a = spray ? rand(-Math.PI, 0) : Math.PI + rand(-0.75, 0.75);
      const sp = (spray ? rand(250, 950) : rand(350, 1150)) * g.speed;
      parts.push({
        x: ox + rand(-4, 4), y: oy + rand(-30, 30),
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - rand(0, 220) * g.speed,
        s: rand(4.5, 9.5) * g.size, rot: rand(0, TAU), vr: rand(-14, 14),
        c: pick(g.colors), hl: g.hl, floor: GROUND - 4 + rand(0, 74), rest: false, delay: rand(0, 0.14),
      });
    }
    const ns = Math.round((g.smokeA > 0.5 ? 34 : 20) * k);
    for (let i = 0; i < ns; i++) {
      const a = Math.PI + rand(-1, 0.6);
      const sp = rand(80, 420) * g.speed;
      smokes.push({ x: ox, y: oy + rand(-20, 20), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - rand(20, 90),
        r: rand(18, 36), grow: rand(40, 110), life: 0, max: rand(1.8, 3.8), c: g.smoke, a: g.smokeA * rand(0.6, 1) });
    }
    const confColors = ['#ff5a4e', '#ffcc4d', '#4ec3ff', '#7be07b', '#ff8ad8', '#ffffff'];
    for (let i = 0; i < Math.round(g.confetti * k); i++) {
      const a = rand(-Math.PI, 0);
      const sp = rand(300, 900);
      confetti.push({ x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 200, w: rand(6, 12), h: rand(3, 6),
        rot: rand(0, TAU), vr: rand(-10, 10), ph: rand(0, TAU), c: pick(confColors), life: 0, max: rand(3, 5) });
    }
    for (let i = 0; i < Math.round(g.sparkle * k); i++) {
      const a = rand(0, TAU);
      const sp = rand(80, 600);
      sparkles.push({ x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, s: rand(4, 10), life: 0, max: rand(1.2, 2.6), ph: rand(0, TAU) });
    }
    for (let i = 0; i < Math.round((g.embers || 0) * k); i++) {
      const a = Math.PI + rand(-1.3, 1.0);
      const sp = rand(150, 800);
      embers.push({ x: ox, y: oy + rand(-20, 20), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - rand(50, 250), s: rand(1.5, 3.5), life: 0, max: rand(1, 2.6) });
    }
    lid = { x: DRUM.left - 8, y: DRUM.cy, vx: -rand(500, 700) * g.speed, vy: -rand(300, 520) * g.speed, rot: 0, vr: -rand(8, 14) * g.speed, rest: false };
    flash = reduceMotion ? g.flash * 0.4 : g.flash;
    flashColor = g.flashColor;
    shake = reduceMotion ? 0 : 0.5 + g.speed * 0.25;
    rays = g.rays ? 1 : 0;
    rayColor = g.rays;
    heat = Math.min(heat, 0.6);
  }

  // ---------- 갱신 ----------
  function update(dt) {
    time += dt;
    if (state === 'cranking') {
      elapsed = (performance.now() - startT) / 1000;
      angle += dt * (6.5 + Math.min(elapsed, 10) * 0.2);
      const half = Math.floor(angle / Math.PI);
      if (half !== lastHalf) { lastHalf = half; tick(); }
      heat = Math.min(1, elapsed / 10);
      pressure = Math.min(1, elapsed / 11) + Math.sin(time * 9) * 0.02 + (Math.random() - 0.5) * 0.04;
      if (Math.random() < dt * (2 + heat * 10)) {
        smokes.push({ x: DRUM.left + rand(0, 10), y: DRUM.cy - DRUM.r + rand(0, 20), vx: rand(-30, 10), vy: rand(-80, -40),
          r: rand(4, 8), grow: rand(10, 24), life: 0, max: rand(0.8, 1.6), c: '235,230,225', a: 0.25 });
      }
      if (elapsed > target + 5) pop(elapsed);
    } else {
      pressure += (0 - pressure) * Math.min(1, dt * 4);
      if (state !== 'intro') heat += (0 - heat) * Math.min(1, dt * 0.6);
    }

    for (const p of parts) {
      if (p.delay > 0) { p.delay -= dt; continue; }
      if (p.rest) continue;
      p.vy += GRAV * dt;
      const drag = Math.exp(-0.9 * dt);
      p.vx *= drag;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.y > p.floor) {
        p.y = p.floor;
        if (Math.abs(p.vy) < 140) { p.rest = true; p.vy = 0; p.vx = 0; }
        else { p.vy *= -0.32; p.vx *= 0.55; p.vr *= 0.5; }
      }
    }
    smokes = smokes.filter((s) => {
      s.life += dt;
      s.vx *= Math.exp(-1.2 * dt); s.vy *= Math.exp(-0.8 * dt); s.vy -= 14 * dt;
      s.x += s.vx * dt; s.y += s.vy * dt; s.r += s.grow * dt;
      return s.life < s.max;
    });
    confetti = confetti.filter((c) => {
      c.life += dt;
      c.vy = Math.min(c.vy + 500 * dt, 110);
      c.vx *= Math.exp(-1.6 * dt);
      c.x += (c.vx + Math.sin(time * 5 + c.ph) * 40) * dt; c.y += c.vy * dt; c.rot += c.vr * dt;
      return c.life < c.max;
    });
    sparkles = sparkles.filter((s) => {
      s.life += dt;
      s.vx *= Math.exp(-2.2 * dt); s.vy *= Math.exp(-2.2 * dt); s.vy += 30 * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      return s.life < s.max;
    });
    embers = embers.filter((e) => {
      e.life += dt;
      e.vx *= Math.exp(-1.4 * dt); e.vy += 200 * dt;
      e.x += e.vx * dt; e.y += e.vy * dt;
      if (e.y > GROUND + 40) { e.y = GROUND + 40; e.vy *= -0.3; }
      return e.life < e.max;
    });
    if (lid && !lid.rest) {
      lid.vy += GRAV * dt; lid.x += lid.vx * dt; lid.y += lid.vy * dt; lid.rot += lid.vr * dt;
      if (lid.y > GROUND + 20) {
        lid.y = GROUND + 20;
        if (Math.abs(lid.vy) < 160) { lid.rest = true; lid.rot = Math.PI / 2; }
        else { lid.vy *= -0.35; lid.vx *= 0.5; lid.vr *= 0.4; }
      }
    }
    flash = Math.max(0, flash - dt * 2.4);
    shake = Math.max(0, shake - dt);
    rays = Math.max(0, rays - dt * 1.1);
  }

  // ---------- 그리기 ----------
  function drawBackground() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#2c1532');
    sky.addColorStop(0.7, '#1d1022');
    sky.addColorStop(1, '#120a15');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // 줄에 매달린 홍등
    const y0 = Math.max(70, H * 0.1);
    const sag = Math.min(60, H * 0.07);
    ctx.strokeStyle = 'rgba(30, 18, 20, 0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-20, y0);
    ctx.quadraticCurveTo(W / 2, y0 + sag * 2, W + 20, y0);
    ctx.stroke();
    const n = Math.max(4, Math.round(W / 140));
    for (let i = 0; i <= n; i++) {
      const u = i / n;
      const x = -20 + (W + 40) * u;
      const y = (1 - u) * (1 - u) * y0 + 2 * (1 - u) * u * (y0 + sag * 2) + u * u * y0;
      const sw = Math.sin(time * 1.3 + i) * 2;
      const glow = ctx.createRadialGradient(x, y + 18, 2, x, y + 18, 60);
      const flick = 0.28 + Math.sin(time * 7 + i * 3) * 0.03 + heat * 0.05;
      glow.addColorStop(0, `rgba(255, 140, 60, ${flick})`);
      glow.addColorStop(1, 'rgba(255, 140, 60, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(x - 60, y - 42, 120, 120);
      ctx.fillStyle = '#d8402c';
      ctx.beginPath();
      ctx.ellipse(x + sw, y + 18, 13, 17, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = 'rgba(255, 200, 120, 0.35)';
      ctx.beginPath();
      ctx.ellipse(x + sw - 3, y + 14, 5, 9, 0, 0, TAU);
      ctx.fill();
      ctx.fillStyle = '#2a1712';
      ctx.fillRect(x + sw - 7, y + 1, 14, 3);
      ctx.fillRect(x + sw - 6, y + 33, 12, 3);
    }

    // 바닥
    const gy = OY + GROUND * S;
    const floor = ctx.createLinearGradient(0, gy, 0, H);
    floor.addColorStop(0, '#33201e');
    floor.addColorStop(1, '#1a0f10');
    ctx.fillStyle = floor;
    ctx.fillRect(0, gy, W, H - gy);
    ctx.strokeStyle = 'rgba(255, 220, 190, 0.05)';
    ctx.lineWidth = 1;
    for (let i = 1; i < 6; i++) {
      const y = gy + (H - gy) * (i / 6) ** 1.6;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    const firelight = ctx.createRadialGradient(OX + 425 * S, gy, 10, OX + 425 * S, gy, 260 * S);
    firelight.addColorStop(0, `rgba(255, 120, 40, ${0.18 + heat * 0.15 + Math.sin(time * 11) * 0.02})`);
    firelight.addColorStop(1, 'rgba(255, 120, 40, 0)');
    ctx.fillStyle = firelight;
    ctx.fillRect(0, gy - 260 * S, W, 520 * S);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

  function drawSign() {
    ctx.save();
    ctx.translate(700, 425);
    ctx.rotate(0.05);
    ctx.fillStyle = '#5a3a22';
    ctx.fillRect(-4, 20, 8, 50);
    ctx.fillStyle = '#c99a5b';
    roundRect(-62, -38, 124, 70, 4);
    ctx.fill();
    ctx.strokeStyle = 'rgba(80, 50, 25, 0.5)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#3b2412';
    ctx.textAlign = 'center';
    ctx.font = '26px "Black Han Sans", sans-serif';
    ctx.fillText('뻥튀기', 0, -6);
    ctx.font = '17px "Do Hyeon", sans-serif';
    ctx.fillStyle = '#7a2a18';
    ctx.fillText('한 봉 3,000원', 0, 20);
    ctx.restore();
  }

  function drawFlames() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const base = 420;
    for (let i = 0; i < 8; i++) {
      const x = 372 + i * 15;
      const h = 22 + Math.sin(time * 13 + i * 1.7) * 6 + Math.random() * 5 + heat * 14;
      const grd = ctx.createLinearGradient(0, base, 0, base - h);
      grd.addColorStop(0, 'rgba(80, 140, 255, 0.85)');
      grd.addColorStop(0.25, 'rgba(255, 150, 40, 0.9)');
      grd.addColorStop(1, 'rgba(255, 230, 120, 0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(x - 7, base);
      ctx.quadraticCurveTo(x - 7, base - h * 0.55, x + Math.sin(time * 9 + i) * 2, base - h);
      ctx.quadraticCurveTo(x + 7, base - h * 0.55, x + 7, base);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawMachine() {
    const { left: L, right: R, cy, r } = DRUM;
    const top = cy - r, bot = cy + r;

    // 받침대
    ctx.strokeStyle = '#4b403b';
    ctx.lineCap = 'round';
    ctx.lineWidth = 10;
    line(345, bot - 4, 322, GROUND);
    line(505, bot - 4, 528, GROUND);
    ctx.lineWidth = 6;
    line(330, GROUND - 26, 520, GROUND - 26);
    ctx.strokeStyle = '#3a3230';
    ctx.lineWidth = 8;
    line(600, cy + 6, 612, GROUND);

    // 가스 버너
    ctx.fillStyle = '#3b3534';
    roundRect(362, 420, 126, 30, 6);
    ctx.fill();
    ctx.fillStyle = '#585150';
    ctx.fillRect(362, 420, 126, 4);
    ctx.strokeStyle = '#2a2524';
    ctx.lineWidth = 5;
    line(488, 440, 560, 452);
    drawFlames();

    // 몸통
    const body = ctx.createLinearGradient(0, top, 0, bot);
    body.addColorStop(0, '#62666f');
    body.addColorStop(0.3, '#33363d');
    body.addColorStop(0.8, '#17181c');
    body.addColorStop(1, '#0d0d10');
    ctx.fillStyle = body;
    roundRect(L, top, R - L, r * 2, 16);
    ctx.fill();
    if (heat > 0.01) {
      const hot = ctx.createLinearGradient(0, bot, 0, cy - 10);
      hot.addColorStop(0, `rgba(255, 80, 30, ${0.6 * heat})`);
      hot.addColorStop(1, 'rgba(255, 80, 30, 0)');
      ctx.fillStyle = hot;
      roundRect(L, top, R - L, r * 2, 16);
      ctx.fill();
    }
    // 회전하는 리벳 줄
    for (let k = 0; k < 8; k++) {
      const th = angle + k * Math.PI / 4;
      const s = Math.sin(th);
      if (s <= 0.05) continue;
      const y = cy - r * 0.86 * Math.cos(th);
      ctx.fillStyle = `rgba(200, 205, 215, ${0.38 * s})`;
      for (let x = L + 22; x < R - 14; x += 18) {
        ctx.beginPath(); ctx.arc(x, y, 1.4 + s * 1.2, 0, TAU); ctx.fill();
      }
    }
    // 띠
    ctx.fillStyle = 'rgba(140, 145, 155, 0.35)';
    ctx.fillRect(L + 34, top, 9, r * 2);
    ctx.fillRect(R - 44, top, 9, r * 2);
    // 하이라이트
    ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
    roundRect(L + 10, top + 8, R - L - 20, 10, 5);
    ctx.fill();

    // 오른쪽 마개와 축
    ctx.fillStyle = '#26282d';
    ctx.beginPath(); ctx.ellipse(R, cy, 10, r + 2, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = '#6f6a63';
    ctx.fillRect(R + 4, cy - 5, DRUM.crankX - R - 4, 10);

    // 레버(크랭크)
    const hx = DRUM.crankX + Math.cos(angle) * 12;
    const hy = cy + Math.sin(angle) * 54;
    ctx.strokeStyle = '#8b8378';
    ctx.lineWidth = 9;
    line(DRUM.crankX, cy, hx, hy);
    ctx.fillStyle = '#8b8378';
    ctx.beginPath(); ctx.arc(DRUM.crankX, cy, 9, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#a0582f';
    ctx.lineWidth = 12;
    line(hx, hy, hx + 30, hy);
    ctx.strokeStyle = 'rgba(255, 220, 180, 0.35)';
    ctx.lineWidth = 3;
    line(hx + 4, hy - 3, hx + 26, hy - 3);

    // 압력계
    ctx.fillStyle = '#4a4d55';
    ctx.fillRect(444, top - 24, 12, 26);
    const gx = 450, gyy = top - 48;
    ctx.fillStyle = '#efe6d2';
    ctx.beginPath(); ctx.arc(gx, gyy, 25, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#8a6d3b';
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(200, 40, 30, 0.85)';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(gx, gyy, 18, -Math.PI * 1.25 + Math.PI * 1.5 * 0.72, Math.PI * 0.25); ctx.stroke();
    ctx.strokeStyle = '#3b2412';
    ctx.lineWidth = 1.5;
    for (let i = 0; i <= 8; i++) {
      const a = -Math.PI * 1.25 + (Math.PI * 1.5) * (i / 8);
      line(gx + Math.cos(a) * 14, gyy + Math.sin(a) * 14, gx + Math.cos(a) * 19, gyy + Math.sin(a) * 19);
    }
    const p = Math.max(0, Math.min(1.05, pressure));
    const na = -Math.PI * 1.25 + Math.PI * 1.5 * p;
    ctx.strokeStyle = '#c62828';
    ctx.lineWidth = 2.5;
    line(gx, gyy, gx + Math.cos(na) * 19, gyy + Math.sin(na) * 19);
    ctx.fillStyle = '#3b2412';
    ctx.beginPath(); ctx.arc(gx, gyy, 3, 0, TAU); ctx.fill();

    // 왼쪽 플랜지와 뚜껑
    ctx.fillStyle = '#24262b';
    ctx.beginPath(); ctx.ellipse(L, cy, 12, r + 6, 0, 0, TAU); ctx.fill();
    if (!lid) drawLid(L - 8, cy, 0);
  }

  function drawLid(x, y, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.fillStyle = '#3d4048';
    ctx.beginPath(); ctx.ellipse(0, 0, 11, DRUM.r - 4, 0, 0, TAU); ctx.fill();
    ctx.strokeStyle = '#5c606a';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = '#8b8378';
    ctx.beginPath(); ctx.arc(-6, 0, 7, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawEffects() {
    // 방사광
    if (rays > 0 && rayColor) {
      ctx.save();
      ctx.translate(DRUM.left - 8, DRUM.cy);
      ctx.rotate(time * 0.8);
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 16; i++) {
        ctx.rotate(TAU / 16);
        ctx.fillStyle = `rgba(${rayColor}, ${0.22 * rays})`;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(900, -50);
        ctx.lineTo(900, 50);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }
    for (const s of smokes) {
      const k = s.life / s.max;
      ctx.fillStyle = `rgba(${s.c}, ${s.a * (1 - k) * Math.min(1, s.life * 8)})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    }
    for (const p of parts) {
      if (p.delay > 0) continue;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * 0.78, 0, 0, TAU); ctx.fill();
      if (p.s > 3) {
        ctx.beginPath(); ctx.ellipse(p.s * 0.45, p.s * 0.2, p.s * 0.6, p.s * 0.5, 0, 0, TAU); ctx.fill();
        if (p.hl) {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.beginPath(); ctx.arc(-p.s * 0.3, -p.s * 0.25, p.s * 0.32, 0, TAU); ctx.fill();
        } else {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
          ctx.beginPath(); ctx.arc(p.s * 0.2, p.s * 0.2, p.s * 0.35, 0, TAU); ctx.fill();
        }
      }
      ctx.restore();
    }
    if (lid) drawLid(lid.x, lid.y, lid.rot);
    for (const c of confetti) {
      const k = c.life / c.max;
      ctx.save();
      ctx.globalAlpha = k > 0.8 ? (1 - k) / 0.2 : 1;
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      ctx.scale(1, Math.cos(time * 8 + c.ph));
      ctx.fillStyle = c.c;
      ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      ctx.restore();
    }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const s of sparkles) {
      const k = s.life / s.max;
      const tw = 0.6 + 0.4 * Math.sin(time * 20 + s.ph);
      const sz = s.s * (1 - k) * tw;
      ctx.fillStyle = `rgba(255, 225, 120, ${(1 - k)})`;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y - sz * 2);
      ctx.quadraticCurveTo(s.x, s.y, s.x + sz * 2, s.y);
      ctx.quadraticCurveTo(s.x, s.y, s.x, s.y + sz * 2);
      ctx.quadraticCurveTo(s.x, s.y, s.x - sz * 2, s.y);
      ctx.quadraticCurveTo(s.x, s.y, s.x, s.y - sz * 2);
      ctx.fill();
    }
    for (const e of embers) {
      const k = e.life / e.max;
      ctx.fillStyle = `rgba(255, ${120 + Math.round(80 * (1 - k))}, 40, ${1 - k})`;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.s * (1.2 - k * 0.6), 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function render() {
    drawBackground();
    let sx = 0, sy = 0;
    if (state === 'cranking' && !reduceMotion) {
      const a = 0.4 + heat * 2.4;
      sx += (Math.random() - 0.5) * a;
      sy += (Math.random() - 0.5) * a;
    }
    if (shake > 0) {
      const a = shake * 26;
      sx += (Math.random() - 0.5) * a;
      sy += (Math.random() - 0.5) * a;
    }
    ctx.setTransform(DPR * S, 0, 0, DPR * S, DPR * (OX + sx * S), DPR * (OY + sy * S));
    drawSign();
    drawMachine();
    drawEffects();

    if (flash > 0) {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      ctx.fillStyle = `rgba(${flashColor}, ${Math.min(1, flash) * 0.85})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  resize();
  newRound();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
